<app-page-header title="Centros de costo" subtitle="Unidades a las que se imputa el consumo de inventario" [crumbs]="[{ label: 'Catálogo' }, { label: 'Centros de costo' }]" />

<app-crud-toolbar
  [(search)]="search"
  [(active)]="active"
  searchPlaceholder="Buscar por código o nombre…"
  [createLabel]="auth.can('cost_centers.create') ? 'Nuevo centro de costo' : null"
  (create)="openCreate()"
>
  <p-select
    [options]="sites()"
    optionLabel="name"
    optionValue="id"
    [ngModel]="siteFilter()"
    (ngModelChange)="onSiteFilterChange($event)"
    [showClear]="true"
    placeholder="Todas las sedes"
    styleClass="w-52"
  />
</app-crud-toolbar>

<div class="card overflow-hidden">
  <p-table
    [value]="rows()"
    [lazy]="true"
    (onLazyLoad)="onLazyLoad($event)"
    [paginator]="true"
    [rows]="perPage()"
    [first]="first"
    [totalRecords]="total()"
    [rowsPerPageOptions]="[10, 20, 50]"
    [loading]="loading()"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="{first}–{last} de {totalRecords}"
    sortField="code"
    [sortOrder]="1"
    dataKey="id"
  >
    <ng-template #header>
      <tr>
        <th pSortableColumn="code" class="w-36">Código <p-sortIcon field="code" /></th>
        <th pSortableColumn="name">Nombre <p-sortIcon field="name" /></th>
        <th>Sede</th>
        <th class="w-28">Estado</th>
        <th class="w-28 text-right">Acciones</th>
      </tr>
    </ng-template>
    <ng-template #body let-row>
      <tr>
        <td class="tabular font-medium text-ink">{{ row.code }}</td>
        <td>{{ row.name }}</td>
        <td class="text-ink-2">{{ row.site?.name || '—' }}</td>
        <td><app-active-chip [active]="row.is_active" /></td>
        <td class="text-right whitespace-nowrap">
          @if (auth.can('cost_centers.update')) {
            <p-button icon="pi pi-pencil" [text]="true" [rounded]="true" severity="secondary" size="small" pTooltip="Editar" (onClick)="openEdit(row)" />
            <p-button [icon]="row.is_active ? 'pi pi-ban' : 'pi pi-check'" [text]="true" [rounded]="true" severity="secondary" size="small" [pTooltip]="row.is_active ? 'Desactivar' : 'Activar'" (onClick)="toggleActive(row)" />
          }
          @if (auth.can('cost_centers.delete')) {
            <p-button icon="pi pi-trash" [text]="true" [rounded]="true" severity="danger" size="small" pTooltip="Eliminar" (onClick)="confirmDelete(row)" />
          }
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="5" class="text-center py-10 text-ink-3">No hay centros de costo que coincidan con la búsqueda.</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<app-form-drawer
  [(visible)]="drawerOpen"
  [title]="editing() ? 'Editar centro de costo' : 'Nuevo centro de costo'"
  [subtitle]="editing()?.name"
  [saving]="saving()"
  (save)="save()"
>
  <ng-container [formGroup]="form">
    <div class="grid grid-cols-3 gap-3">
      <app-field label="Código" [required]="true" [control]="form.controls['code']" [serverError]="err('code')" [submitted]="submitted()">
        <input pInputText formControlName="code" class="w-full uppercase" maxlength="20" placeholder="CC-01" />
      </app-field>
      <div class="col-span-2">
        <app-field label="Nombre" [required]="true" [control]="form.controls['name']" [serverError]="err('name')" [submitted]="submitted()">
          <input pInputText formControlName="name" class="w-full" placeholder="Mantenimiento" />
        </app-field>
      </div>
    </div>
    <app-field label="Sede" hint="Opcional. Déjalo vacío si aplica a toda la empresa." [control]="form.controls['site_id']" [serverError]="err('site_id')" [submitted]="submitted()">
      <p-select formControlName="site_id" [options]="sites()" optionLabel="name" optionValue="id" [showClear]="true" [filter]="sites().length > 8" placeholder="Sin sede" styleClass="w-full" />
    </app-field>
    <div class="flex items-center gap-3 pt-1">
      <p-toggleswitch formControlName="is_active" inputId="cc_active" />
      <label for="cc_active" class="text-sm">Centro de costo activo</label>
    </div>
  </ng-container>
</app-form-drawer>
